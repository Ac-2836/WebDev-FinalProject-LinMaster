name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linmaster
          POSTGRES_PASSWORD: linmaster
          POSTGRES_DB: linmaster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only throwaway database for migrations and tests.
      DATABASE_URL: postgresql://linmaster:linmaster@localhost:5432/linmaster_test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate test database
        run: npm run db:deploy -w server

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linmaster
          POSTGRES_PASSWORD: linmaster
          POSTGRES_DB: linmaster_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only throwaway database; the e2e API runs with a fake AI model (client/tests/e2e/mock-ai.mjs).
      DATABASE_URL: postgresql://linmaster:linmaster@localhost:5432/linmaster_e2e
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Migrate e2e database
        run: npm run db:deploy -w server

      - name: Build server
        run: npm run build -w server

      - name: E2E
        run: npm run e2e -w client

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
