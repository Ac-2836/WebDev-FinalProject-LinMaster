name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linmaster
          POSTGRES_PASSWORD: linmaster
          POSTGRES_DB: linmaster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only throwaway database; the server starts using it from P1-03 (Prisma).
      DATABASE_URL: postgresql://linmaster:linmaster@localhost:5432/linmaster_test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
