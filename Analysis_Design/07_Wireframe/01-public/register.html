<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký</title>
  <script src="../assets/wf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
</head>
<body class="min-h-screen bg-white">
<div class="grid min-h-screen lg:grid-cols-[1fr_1.05fr]">
  <main id="main" class="flex flex-col px-4 py-6 sm:px-10">
    <div class="flex items-center justify-between">
      <a href="landing.html" aria-label="LinMaster, trang chủ"><span data-logo="full" data-size="30"></span></a>
      <button class="btn btn-ghost btn-sm" aria-label="Đổi ngôn ngữ, đang là Tiếng Việt"><i data-lucide="globe" class="size-4"></i>VI</button>
    </div>

    <div class="mx-auto flex w-full max-w-sm flex-1 flex-col justify-center gap-7 py-12">
      <div>
        <h1 class="h1">Tạo tài khoản miễn phí</h1>
        <p class="mt-2 text-muted-foreground">Chỉ cần email. Bắt đầu học trong 1 phút.</p>
      </div>

      <form class="flex flex-col gap-4" novalidate>
        <label class="flex flex-col gap-1.5"><span class="label">Tên hiển thị</span><input class="input" autocomplete="name" placeholder="Nguyễn Văn A" maxlength="80"></label>
        <div class="flex flex-col gap-1.5">
          <label for="em" class="label">Email</label>
          <input id="em" class="input" type="email" autocomplete="email" placeholder="ban@example.com">
          <p data-state="error" class="flex items-center gap-1 text-[13px] text-destructive"><i data-lucide="circle-alert" class="size-3.5"></i>Email này đã được dùng. <a href="login.html" class="font-semibold underline">Đăng nhập?</a></p>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="pw" class="label">Mật khẩu</label>
          <input id="pw" class="input" type="password" autocomplete="new-password" aria-describedby="pwh">
          <div class="flex gap-1" aria-hidden="true"><span class="h-1 flex-1 rounded-full bg-success"></span><span class="h-1 flex-1 rounded-full bg-success"></span><span class="h-1 flex-1 rounded-full bg-muted"></span></div>
          <p id="pwh" class="hint">Tối thiểu 8 ký tự.</p>
        </div>
        <label class="flex flex-col gap-1.5">
          <span class="label">Band mục tiêu <span class="font-normal text-muted-foreground">(không bắt buộc)</span></span>
          <select class="input"><option value="">Chưa đặt</option><option>5.5</option><option>6.0</option><option selected>6.5</option><option>7.0</option><option>7.5</option><option>8.0</option></select>
          <span class="hint">Dashboard dùng để so với điểm thi thử. Đổi được trong Hồ sơ.</span>
        </label>
        <button data-state="default error" class="btn btn-primary btn-lg mt-2 w-full" type="submit">Tạo tài khoản</button>
        <button data-state="loading" class="btn btn-primary btn-lg mt-2 w-full" disabled aria-busy="true"><i data-lucide="loader-circle" class="size-4 animate-spin"></i>Đang tạo…</button>
      </form>

      <p class="text-center text-sm text-muted-foreground">Đã có tài khoản? <a href="login.html" class="font-semibold text-primary hover:underline">Đăng nhập</a></p>
    </div>
    <p class="hint text-center">© 2026 LinMaster</p>
  </main>

  <aside class="glow-strong hidden items-center justify-center p-12 lg:flex" aria-hidden="true">
    <div class="flex w-full max-w-md flex-col gap-5">
      <p class="eyebrow">Bạn sẽ có</p>
      <script>
        document.write([['sparkles','AI giải thích theo câu','Nghĩa đúng ngữ cảnh, không phải nghĩa từ điển chung chung.'],['layers','Flashcard tự lên lịch','Ôn đúng lúc sắp quên với SM-2.'],['monitor','Phòng thi như thi máy','Reading, Listening, chấm band ngay.']].map(([i,t,d],k)=>`<div class="flex gap-4 rounded-[20px] bg-white/90 p-5 shadow-lift ${k===1?'ml-8':''}"><span class="tile"><i data-lucide="${i}" class="size-5"></i></span><div><p class="font-semibold">${t}</p><p class="text-sm text-muted-foreground">${d}</p></div></div>`).join(''));
      </script>
    </div>
  </aside>
</div>
</body>
</html>
