<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thư viện</title>
  <script src="../assets/wf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
</head>
<body class="pb-20 lg:pb-0">
<div data-app-nav="library"></div>
<!-- /library: GET /library?type=set|test&q=&topic=&skill=&sort=new|popular&page -->
<main id="main" class="page flex flex-col gap-5">
  <header><h1 class="h1">Thư viện cộng đồng</h1><p class="mt-1 text-muted-foreground">Bộ thẻ và đề thi do người học khác chia sẻ.</p></header>

  <div class="flex border-b text-sm font-semibold" role="tablist">
    <button role="tab" aria-selected="true" class="border-b-2 border-primary px-4 py-2.5 text-primary"><i data-lucide="layers" class="mr-1 inline size-4"></i>Bộ thẻ</button>
    <button role="tab" class="px-4 py-2.5 text-muted-foreground"><i data-lucide="clipboard-check" class="mr-1 inline size-4"></i>Đề thi</button>
  </div>

  <div class="flex flex-col gap-3 md:flex-row">
    <label class="relative flex-1"><span class="sr-only">Tìm trong thư viện</span><i data-lucide="search" class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted-foreground"></i><input class="input pl-9" placeholder="Tìm bộ thẻ theo tên, chủ đề"></label>
    <div class="grid grid-cols-2 gap-2 md:flex">
      <select class="input md:w-44" aria-label="Chủ đề"><option>Mọi chủ đề</option><option>Environment</option></select>
      <select class="input md:w-40" aria-label="Sắp xếp"><option>Phổ biến</option><option>Mới nhất</option></select>
    </div>
  </div>

  <ul data-state="default" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <script>
      document.write([
        ['Academic Word List 1–3','Minh Anh',180,'2,1k','Education'],
        ['IELTS Environment vocabulary','Thu Trang',64,'986','Environment'],
        ['Cambridge collocations','Quốc Bảo',120,'742','General'],
        ['Linking words for Writing','Hà My',48,'510','Writing'],
        ['Health & medicine','Khôi',72,'233','Health'],
        ['Phrasal verbs B2','Lan',90,'198','General'],
      ].map(([t,a,n,c,tp]) => `<li class="card flex flex-col gap-3 p-5 hover:border-primary">
        <div class="flex items-center gap-2"><span class="badge">${tp}</span><span class="hint ml-auto flex items-center gap-1"><i data-lucide="copy" class="size-3.5"></i>${c} lượt chép</span></div>
        <a href="set-preview.html" class="font-bold hover:text-primary">${t}</a>
        <p class="hint">${n} thẻ</p>
        <p class="mt-auto flex items-center gap-2 text-sm"><span class="inline-flex size-6 items-center justify-center rounded-full bg-muted text-[10px] font-bold">${a.split(' ').map(w=>w[0]).join('')}</span>${a}</p></li>`).join(''));
    </script>
  </ul>
  <!-- Tests tab card example -->
  <div data-state="tests" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <script>
      document.write([['Mock Listening A','Listening','40 câu · 32 phút','1,2k'],['Reading Practice — Science','Reading','40 câu · 60 phút','640'],['Full Practice 1','Full','80 câu · 2 giờ 32 phút','415']].map(([t,k,d,n])=>`<a href="test-preview.html" class="card flex flex-col gap-3 p-5 hover:border-primary"><div class="flex items-center gap-2"><span class="badge">${k}</span><span class="hint ml-auto">${n} lượt làm</span></div><span class="font-bold">${t}</span><span class="hint">${d}</span></a>`).join(''))
    </script>
  </div>

  <nav data-state="default" class="flex justify-center gap-1" aria-label="Phân trang"><button class="btn btn-secondary btn-sm" disabled>Trước</button><button class="btn btn-primary btn-sm" aria-current="page">1</button><button class="btn btn-ghost btn-sm">2</button><button class="btn btn-ghost btn-sm">3</button><button class="btn btn-secondary btn-sm">Sau</button></nav>

  <div data-state="loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true" aria-label="Đang tải"><script>document.write('<div class="card flex h-40 flex-col gap-3 p-5"><div class="skeleton h-5 w-20"></div><div class="skeleton h-5 w-3/4"></div><div class="skeleton mt-auto h-4 w-1/3"></div></div>'.repeat(6))</script></div>
  <div data-state="empty" class="card flex flex-col items-center gap-3 p-12 text-center"><i data-lucide="search-x" class="size-10 text-muted-foreground"></i><p class="text-lg font-bold">Không có bộ thẻ nào khớp "geography"</p><p class="text-muted-foreground">Thử từ khóa khác, hoặc tự tạo và đăng bộ thẻ đầu tiên về chủ đề này.</p><button class="btn btn-secondary btn-sm">Xóa bộ lọc</button></div>
  <div data-state="error" role="alert" class="card flex flex-col items-center gap-3 p-10 text-center"><span class="inline-flex size-12 items-center justify-center rounded-full bg-danger-soft text-destructive"><i data-lucide="cloud-off" class="size-6"></i></span><p class="font-bold">Không tải được thư viện</p><button class="btn btn-secondary btn-sm"><i data-lucide="rotate-cw" class="size-4"></i>Thử lại</button></div>
</main>
</body>
</html>
