<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bộ thẻ</title>
  <script src="../assets/wf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
</head>
<body class="pb-20 lg:pb-0">
<div data-app-nav="flashcards"></div>
<!-- /flashcards: GET /flashcards/sets. One flat list, no tabs or filters; no progress bar or visibility badge on the cards. -->
<main id="main" class="page flex flex-col gap-6">
  <header class="flex flex-wrap items-end gap-3">
    <div class="flex-1"><p class="eyebrow">Flashcard</p><h1 class="h1 mt-1">Bộ thẻ của tôi</h1><p class="mt-1 text-muted-foreground">18 thẻ đến hạn hôm nay trong 2 bộ.</p></div>
    <a href="../03-vocab/word-bank.html" class="btn btn-secondary"><i data-lucide="notebook-pen" class="size-4"></i><span class="hidden sm:inline">Tạo từ kho từ</span><span class="sm:hidden">Từ kho từ</span></a>
    <a href="editor.html" class="btn btn-primary"><i data-lucide="plus" class="size-4"></i>Bộ thẻ mới</a>
  </header>

  <ul data-state="default" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <script>
      document.write([
        ['IELTS Environment',42,12],
        ['Từ trong bài "Coastal cities"',9,6],
        ['Academic Word List 1',60,0],
        ['Phrasal verbs for Speaking',35,8],
        ['Cambridge collocations',120,0],
      ].map(([t,n,due]) => `<li class="card flex flex-col gap-4 p-5">
        <div class="flex items-start justify-between gap-2"><span class="tile size-10 rounded-xl"><i data-lucide="layers" class="size-5"></i></span></div>
        <div><a href="set.html" class="font-bold hover:text-primary">${t}</a><p class="hint">${n} thẻ${due?` · <span class="font-semibold text-warning">${due} đến hạn</span>`:''}</p></div>
        <div class="mt-auto flex gap-2">${due?`<a href="study-learn.html" class="btn btn-primary btn-sm flex-1">Học ngay</a>`:`<a href="set.html" class="btn btn-secondary btn-sm flex-1">Xem bộ thẻ</a>`}<a href="editor.html" class="btn btn-ghost btn-icon btn-sm" aria-label="Sửa ${t}"><i data-lucide="pencil" class="size-4"></i></a></div></li>`).join(''));
    </script>
  </ul>

  <div data-state="loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true" aria-label="Đang tải"><script>document.write('<div class="card flex h-52 flex-col gap-3 p-5"><div class="skeleton size-10"></div><div class="skeleton h-5 w-2/3"></div><div class="skeleton h-4 w-1/3"></div><div class="skeleton mt-auto h-8 w-full"></div></div>'.repeat(3))</script></div>

  <div data-state="empty" class="card flex flex-col items-center gap-4 px-6 py-14 text-center">
    <span class="tile size-14 rounded-3xl"><i data-lucide="layers" class="size-7"></i></span>
    <div><p class="text-lg font-bold">Chưa có bộ thẻ nào</p><p class="mx-auto mt-1 max-w-sm text-muted-foreground">Tạo bộ thẻ từ những từ đã lưu trong kho từ, hoặc tự gõ thẻ mới.</p></div>
    <div class="flex flex-col gap-2 sm:flex-row"><a href="editor.html" class="btn btn-primary">Bộ thẻ mới</a></div>
  </div>
  <div data-state="error" role="alert" class="card flex flex-col items-center gap-3 p-10 text-center"><span class="inline-flex size-12 items-center justify-center rounded-full bg-danger-soft text-destructive"><i data-lucide="cloud-off" class="size-6"></i></span><p class="font-bold">Không tải được bộ thẻ</p><button class="btn btn-secondary btn-sm"><i data-lucide="rotate-cw" class="size-4"></i>Thử lại</button></div>
</main>
</body>
</html>
