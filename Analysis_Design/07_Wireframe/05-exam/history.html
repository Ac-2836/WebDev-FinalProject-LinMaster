<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử làm bài</title>
  <script src="../assets/wf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
</head>
<body class="pb-20 lg:pb-0">
<div data-app-nav="tests"></div>
<!-- /attempts: GET /attempts -->
<main id="main" class="page flex max-w-4xl flex-col gap-6">
  <a href="tests.html" class="hint inline-flex w-fit items-center gap-1 hover:underline"><i data-lucide="arrow-left" class="size-3.5"></i>Thi thử</a>
  <header class="flex flex-wrap items-end gap-3"><h1 class="h1 flex-1">Lịch sử làm bài</h1><select class="input w-auto" aria-label="Lọc kỹ năng"><option>Mọi kỹ năng</option><option>Reading</option><option>Listening</option></select></header>

  <ul data-state="default" class="card divide-y">
    <script>
      document.write([
        ['Practice Test 3','Full','Đang làm','Còn 38 phút','', 'room-reading.html'],
        ['Practice Test 3','Full','02/11 · 22:41','L 6.5 · R 7.0','Tự nộp khi hết giờ','result.html'],
        ['Practice Test 2','Reading','30/10 · 19:20','R 7.0','','result.html'],
        ['Mock Listening A (thư viện)','Listening','28/10 · 21:02','L 6.0','','result.html'],
      ].map(([t,k,d,b,note,href]) => `<li><a href="${href}" class="flex flex-wrap items-center gap-x-4 gap-y-1 p-4 hover:bg-muted/40">
        <div class="min-w-0 flex-1"><p class="truncate font-semibold">${t}</p><p class="hint">${k} · ${d}${note?` · <span class="text-warning">${note}</span>`:''}</p></div>
        <span class="badge ${d==='Đang làm'?'badge-primary':'badge-success'}">${b}</span><i data-lucide="chevron-right" class="size-4 text-muted-foreground"></i></a></li>`).join(''));
    </script>
  </ul>
  <div data-state="loading" class="card flex flex-col divide-y" aria-busy="true" aria-label="Đang tải"><script>document.write('<div class="flex gap-4 p-4"><div class="skeleton h-4 w-1/3"></div><div class="skeleton ml-auto h-4 w-16"></div></div>'.repeat(4))</script></div>
  <div data-state="empty" class="card flex flex-col items-center gap-4 px-6 py-14 text-center"><span class="tile size-14 rounded-3xl"><i data-lucide="history" class="size-7"></i></span><p class="text-lg font-bold">Chưa có lần làm bài nào</p><a href="tests.html" class="btn btn-primary">Chọn đề để làm</a></div>
  <div data-state="error" role="alert" class="card flex flex-col items-center gap-3 p-10 text-center"><span class="inline-flex size-12 items-center justify-center rounded-full bg-danger-soft text-destructive"><i data-lucide="cloud-off" class="size-6"></i></span><p class="font-bold">Không tải được lịch sử</p><button class="btn btn-secondary btn-sm"><i data-lucide="rotate-cw" class="size-4"></i>Thử lại</button></div>
</main>
</body>
</html>
